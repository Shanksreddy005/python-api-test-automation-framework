[pytest]
addopts = -v --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Quick tests for core functionality
    regression: Full test suite for regressions
    api: Tests covering specific API endpoints
    negative: Tests designed to verify system failure handling
    boundary: Tests evaluating inputs at edge/boundary values
    performance: Tests focusing on response times and throughput
